name: Budget sweep
# Runs the PPO vs BC+PPO budget sweep on GitHub-hosted CPUs and commits
# runs/sweep/RESULTS.md (+ per-run metrics) back to the branch.
# Triggered by changes to this file or manually (Actions tab -> Run workflow).
on:
  push:
    branches: [upgrade/2026-11-portfolio]
    paths: ['.github/workflows/sweep.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cell:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        method: [ppo, bc_ppo]
        steps: [8192, 131072, 524288]
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow
      - name: Train and evaluate one cell
        env:
          OMP_NUM_THREADS: '1'
        run: |
          python - <<'EOF'
          import time, torch
          from pathlib import Path
          from layoutpilot.sweep import train_cell
          torch.set_num_threads(1)
          t = time.time()
          train_cell(Path('runs/sweep'), '${{ matrix.method }}', ${{ matrix.steps }}, ${{ matrix.seed }}, 200, ['--rollout', '512'])
          print(f'cell finished in {time.time() - t:.0f}s')
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.method }}-${{ matrix.steps }}-${{ matrix.seed }}
          path: |
            runs/sweep/**/metrics.json
            runs/sweep/**/training.csv

  aggregate:
    needs: cell
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: cell-*
          path: runs/sweep
          merge-multiple: true
      - name: Aggregate
        run: |
          python -m layoutpilot.sweep --aggregate-only
          cat runs/sweep/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f runs/sweep/RESULTS.md runs/sweep/summary.json runs/sweep/*/steps_*/seed_*/metrics.json runs/sweep/*/steps_*/seed_*/training.csv
          git commit -m "Sweep results from GitHub Actions run ${{ github.run_id }}"
          git push origin HEAD:${{ github.ref_name }}
